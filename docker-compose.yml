# ----------------------------------------------------------------------------------------------------------------#*eddiere
version: '3.8'

services:
  # ---------------------------------------------
  # NestJS Application API Service
  # ---------------------------------------------
  api:
    build:
      context: .
      target: development # Targets the dev stage for hot reloading and development
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: factopay_api
    command: sh -c "npx --no-install prisma generate && npx --no-install prisma migrate deploy && npm run start:dev"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Prevents host node_modules from overwriting container
      - /usr/src/app/dist # Prevents container build output from leaking to host
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      PII_BLIND_INDEX_SALT: ${PII_BLIND_INDEX_SALT:-dev-blind-index-salt}
      SESSION_BINDING_SALT: ${SESSION_BINDING_SALT:-dev-session-salt}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      TRANSAK_WEBHOOK_SECRET: ${TRANSAK_WEBHOOK_SECRET:-dev-transak-secret}
      SUMSUB_WEBHOOK_SECRET: ${SUMSUB_WEBHOOK_SECRET:-dev-sumsub-secret}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC12345678901234567890123456789012}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-0123456789abcdef0123456789abcdef}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+1234567890}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_WALLET_ENCRYPTION_KEY: ${STELLAR_WALLET_ENCRYPTION_KEY:-dev-stellar-key}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - factopay_network

  # ---------------------------------------------
  # Redis Cache & Queue Service
  # ---------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: factopay_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factopay_network

volumes:
  redisdata:
    driver: local

networks:
  factopay_network:
    driver: bridge

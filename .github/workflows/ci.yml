name: FactoPay CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  id-token: write # Required for requesting AWS OIDC credentials
  contents: read  # Required for checkout

jobs:
  build-and-test:
    name: Build, Lint, and Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: factopay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Detect Hardcoded Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check Dependencies Security (Audit)
        run: npm audit --audit-level=high || true

      - name: Type Check (TypeScript compiler check)
        run: npx tsc --noEmit

      - name: Setup Prisma Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/factopay_test?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/factopay_test?schema=public
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/factopay_test?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/factopay_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: supersecretaccesskeytest123!@#
          JWT_REFRESH_SECRET: supersecretrefreshkeytest123!@#
          PII_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TOTP_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SESSION_BINDING_SECRET: cccccccccccccccccccccccccccccccc
          WEBHOOK_SIGNING_SECRET: dddddddddddddddddddddddddddddddd
        run: npm run test

      - name: Build Application
        run: npm run dev-build || npm run build

  deploy:
    name: Deploy to AWS
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH and Trigger Blue-Green Deployment
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          ECR_REPO_URL: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
          AWS_SECRETS_MANAGER_NAME: ${{ vars.AWS_SECRETS_MANAGER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ssh $EC2_USER@$EC2_HOST "
            # Authenticate Docker on the host to ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_URL

            # Retrieve database URLs from AWS Secrets Manager using host IAM Instance Profile
            secrets=\$(aws secretsmanager get-secret-value --secret-id \"$AWS_SECRETS_MANAGER_NAME\" --query SecretString --output text)
            db_url=\$(echo \"\$secrets\" | python3 -c \"import sys, json; print(json.load(sys.stdin).get('DATABASE_URL', ''))\")
            direct_url=\$(echo \"\$secrets\" | python3 -c \"import sys, json; print(json.load(sys.stdin).get('DIRECT_URL', ''))\")

            # Write properties to host environment file for docker-compose
            echo \"ECR_REPO_URL=$ECR_REPO_URL\" > ~/app/.env
            echo \"AWS_SECRETS_MANAGER_NAME=$AWS_SECRETS_MANAGER_NAME\" >> ~/app/.env
            echo \"AWS_REGION=$AWS_REGION\" >> ~/app/.env
            echo \"DATABASE_URL=\$db_url\" >> ~/app/.env
            echo \"DIRECT_URL=\$direct_url\" >> ~/app/.env

            # Trigger blue-green deployment script
            bash ~/app/scripts/deploy.sh
          "
